name: Codex++ Windows x64 build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fastaiapi-groups/CodexPlusPlus
          ref: 0c135cf944792f0fdefb66ba385b7efe6a2fdd88
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: |
          npm ci
          npm run check
          npm run vite:build
      - name: Build Windows release executable
        run: cargo build --release --locked -p codex-plus-manager
      - name: Build Windows credential verification probe
        run: cargo build --release --locked -p codex-plus-core --example upgrade_state_probe
      - name: Package installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version = (Get-Content apps/codex-plus-manager/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw 'NSIS compiler missing' }
          Push-Location scripts/installer/windows
          try {
            & $makensis /INPUTCHARSET UTF8 "/DVERSION=$version" CodexPlusPlus.nsi
            if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          } finally { Pop-Location }
      - name: Test real Windows install and overwrite upgrade
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1).FullName
          $scriptPath = (Resolve-Path scripts/test-windows-upgrade.ps1).Path
          $script = [IO.File]::ReadAllText($scriptPath).Replace('1.11.3', '2.6.3').Replace('9f9ee02dbdd80ad0b054f5ff7b6382089289ea88ab38963c1c32a6e05d660166', '1516cecd92ab49a5e665e0de3f8814de239fcc297291bae715d759b90dadff6d')
          [IO.File]::WriteAllText($scriptPath, $script)
          & $scriptPath -Installer $installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-upgrade-acceptance
          path: ${{ runner.temp }}/fastaiapi-install-acceptance/result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: fastaiapi-windows-x64
          path: dist/windows/*-setup.exe
          if-no-files-found: error
          retention-days: 14
